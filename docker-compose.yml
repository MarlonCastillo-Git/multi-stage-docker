name: multi-stage-docker
services:
  frontend:
    image: multi-stage-docker-frontend:local
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
    init: true
    restart: unless-stopped
    environment:
      API_BASE_URL: http://backend:8080/api/v1
      APP_URL: ${APP_URL:-http://localhost:3000}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks: [web]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
  backend:
    image: multi-stage-docker-backend:local
    build: ./backend
    init: true
    restart: unless-stopped
    environment:
      APP_NAME: E-commerce API
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?Ejecute ./scripts/setup.sh}
      APP_URL: ${API_URL:-http://localhost:8000}
      LOG_CHANNEL: stderr
      LOG_LEVEL: warning
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-ecommerce}
      DB_USERNAME: ${MYSQL_USER:-ecommerce}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Ejecute ./scripts/setup.sh}
      JWT_SECRET: ${JWT_SECRET:?Ejecute ./scripts/setup.sh}
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: sync
      SEED_DEMO: ${SEED_DEMO:-false}
      STRIPE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_SECRET: ${STRIPE_SECRET:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks: [web, data]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
  mysql:
    image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Ejecute ./scripts/setup.sh}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ecommerce}
      MYSQL_USER: ${MYSQL_USER:-ecommerce}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Ejecute ./scripts/setup.sh}
    volumes:
      - mysql_data:/var/lib/mysql
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u "$$MYSQL_USER" "$$MYSQL_DATABASE" -e "SELECT 1" >/dev/null 2>&1']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
networks:
  web:
  data:
    internal: true
volumes:
  mysql_data:
